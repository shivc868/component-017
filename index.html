<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>MADEFORAWARD® — Digital Art Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="stage">
      <div class="stage__glow"></div>
      <div class="stage__grain"></div>

      <section class="slider" aria-label="Team slider">
        <div class="slider__track"></div>
      </section>

      <footer class="hud hud--bottom">
        <div class="hud__meta">
          <span class="hud__role"><i></i><em></em></span>
          <h1 class="hud__title" aria-live="polite"></h1>
        </div>
      </footer>

      <div class="cursor"><span>DRAG</span></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
